name: Refresh live football and rotating question data
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily refreshes
        env:
          LIVE_REFRESH_URL: ${{ secrets.LIVE_REFRESH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$LIVE_REFRESH_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set LIVE_REFRESH_URL and CRON_SECRET in GitHub repository secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST "$LIVE_REFRESH_URL" \
            --header "X-Refresh-Secret: $CRON_SECRET" \
            --header "Content-Type: application/json"
          DAILY_REFRESH_URL="${LIVE_REFRESH_URL%/api/refresh-live-football}/api/refresh-daily-content"
          curl --fail-with-body --silent --show-error \
            --request POST "$DAILY_REFRESH_URL" \
            --header "X-Refresh-Secret: $CRON_SECRET" \
            --header "Content-Type: application/json"
